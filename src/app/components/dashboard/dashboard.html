<div style="padding: 24px;">
  <h1 style="font-size: 28px; font-weight: bold; color: #2D5A27; margin-bottom: 24px;">首頁儀表板</h1>

  <!-- 跑馬燈 - 佔滿整行 (col-12) -->
  <div style="margin-bottom: 24px;">
    <app-marquee></app-marquee>
  </div>

  <!-- 2x2 網格佈局 - 四個組件各佔 col-6 -->
  <div style="
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    max-width: 1600px;
  ">
    <!-- 左上: WeatherMain (天氣資訊) -->
    <div style="
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 2px solid #E8F2E6;
    ">
      <div style="display: flex; align-items: center; margin-bottom: 16px;">
        <i class="pi pi-sun" style="font-size: 24px; color: #2D5A27; margin-right: 12px;"></i>
        <h2 style="font-size: 20px; font-weight: 600; color: #2D5A27; margin: 0;">天氣資訊</h2>
      </div>
      <app-weather-main></app-weather-main>
    </div>

    <!-- 右上: Market (市場情報) -->
    <div style="
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 2px solid #E8F2E6;
    ">
      <div style="display: flex; align-items: center; margin-bottom: 16px;">
        <i class="pi pi-chart-line" style="font-size: 24px; color: #2D5A27; margin-right: 12px;"></i>
        <h2 style="font-size: 20px; font-weight: 600; color: #2D5A27; margin: 0;">市場情報</h2>
      </div>
      <app-market></app-market>
    </div>

    <!-- 左下: Spray (智慧噴藥) -->
    <div style="
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 2px solid #E8F2E6;
    ">
      <div style="display: flex; align-items: center; margin-bottom: 16px;">
        <i class="pi pi-shield" style="font-size: 24px; color: #2D5A27; margin-right: 12px;"></i>
        <h2 style="font-size: 20px; font-weight: 600; color: #2D5A27; margin: 0;">智慧噴藥</h2>
      </div>
      <app-spray></app-spray>
    </div>

    <!-- 右下: Journal (耕作日誌) -->
    <div style="
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 2px solid #E8F2E6;
    ">
      <div style="display: flex; align-items: center; margin-bottom: 16px;">
        <i class="pi pi-book" style="font-size: 24px; color: #2D5A27; margin-right: 12px;"></i>
        <h2 style="font-size: 20px; font-weight: 600; color: #2D5A27; margin: 0;">耕作日誌</h2>
      </div>
      <app-journal></app-journal>
    </div>
  </div>
</div>
