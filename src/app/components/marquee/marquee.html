<div
  class="bg-gradient-to-br from-primary to-primary-400 rounded-xl px-6 py-4 overflow-hidden relative shadow-lg shadow-primary/20">
  <div class="flex items-center">
    <!-- 圖示 -->
    <i class="pi pi-megaphone text-2xl text-white mr-4"></i>

    <!-- 跑馬燈容器 -->
    <div class="flex-1 overflow-hidden relative h-8">
      @if (isLoading) {
      <div class="flex items-center h-full">
        <span class="text-white text-base font-medium">載入中...</span>
      </div>
      } @else {
      <div class="marquee-content flex items-center whitespace-nowrap animate-marquee">
        @for (item of marqueeItems; track $index) {
        <span class="text-white text-base font-medium mr-12">{{ item }}</span>
        }

        <!-- 複製一份內容以實現無縫循環 -->
        @for (item of marqueeItems; track $index) {
        <span class="text-white text-base font-medium mr-12">{{ item }}</span>
        }
      </div>
      }
    </div>
  </div>
</div>

<style>
  @keyframes marquee {
    0% {
      transform: translateX(0);
    }

    100% {
      transform: translateX(-50%);
    }
  }

  .marquee-content {
    display: inline-flex;
  }

  .animate-marquee {
    animation: marquee 200s linear infinite;
  }
</style>
